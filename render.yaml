databases:
  - name: uniexchange-db
    databaseName: uniexchange
    user: uniexchange_user
    plan: free

services:
  - type: web
    name: uniexchange-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: uniexchange-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://uniexchange-frontend.onrender.com

  - type: web
    name: uniexchange-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://uniexchange-api.onrender.com
